name: Audit resume snapshot
on:
  push:
    branches: [docs/b-current-guides-audit-20261007]
    paths: [.github/workflows/audit-resume-snapshot-temporary.yml]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  collect:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Collect public sources and collaboration records; execute no project code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, pathlib, re, subprocess, time, urllib.request, urllib.error
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-resume';root.mkdir()
          start=datetime.datetime.now(datetime.timezone.utc).isoformat()
          def save(path,value):
              p=root/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')
          save('collection-start.json',{'started_at_utc':start})
          def collect(short):
              repo='seokpan-hybrid-'+short;page_log=[];errors=[]
              def get(tail):
                  request=urllib.request.Request('https://api.github.com/repos/seokpan/'+repo+('/'+tail if tail else ''),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'seokpan-public-audit'})
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(request,timeout=45) as r:return json.load(r),r.headers
                      except urllib.error.HTTPError as e:
                          if e.code not in (429,502,503) or attempt==2:raise RuntimeError(str(e.code)+' '+tail) from None
                          time.sleep(3*(attempt+1))
              def pages(tail,key=None):
                  rows=[]
                  for page in range(1,101):
                      path=tail+('&' if '?' in tail else '?')+'per_page=100&page='+str(page)
                      data,headers=get(path);items=data if key is None else data[key]
                      assert isinstance(items,list);rows.extend(items)
                      more='rel="next"' in headers.get('Link','');page_log.append({'path':path,'count':len(items),'has_next':more})
                      if not more:return rows
                  raise RuntimeError('Pagination limit')
              def store(label,tail,key=None):
                  try:
                      rows=pages(tail,key);save('metadata/'+short+'/'+label+'.json',rows);return rows
                  except Exception as e:errors.append({'label':label,'error':str(e)});return []
              meta,_=get('');assert meta['private'] is False
              before=store('branches-start','branches')
              mirror=root/(short+'.git');subprocess.run(['git','clone','--quiet','--mirror','https://github.com/seokpan/'+repo+'.git',str(mirror)],check=True,timeout=180)
              def git(*args):return subprocess.check_output(['git','--git-dir',str(mirror),*args])
              save('metadata/'+short+'/history-index.json',{'text':git('log','--all','--date=iso-strict','--format=COMMIT %H%nPARENTS %P%nDATE %cI%nSUBJECT %s','--name-status').decode(),'scope':'reachable refs; change paths, not semantic proof'})
              excludes=[];files=0
              blobs=root/'blobs'/short;blobs.mkdir(parents=True)
              for branch in before:
                  sha=branch['commit']['sha'];entries=[]
                  for row in git('ls-tree','-rlz',sha).split(b'\0'):
                      if not row:continue
                      info,path=row.split(b'\t',1);mode,kind,blob,size=info.decode().split();path=path.decode()
                      item={'path':path,'mode':mode,'type':kind,'blob_sha':blob,'size':int(size) if size!='-' else None};entries.append(item)
                      if kind!='blob':continue
                      reason=None
                      if pathlib.PurePosixPath(path).suffix.lower() in ('.ttf','.otf','.woff','.woff2','.key','.p12','.pfx','.age') or '.sops.' in path:reason='font or protected input'
                      elif int(size)>20000000:reason='large file'
                      target=blobs/blob
                      if reason is None and not target.exists():
                          data=git('cat-file','blob',blob)
                          if re.search(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|AGE-SECRET-KEY-[A-Z0-9]{40,}|\b(?:AKIA|ASIA)[A-Z0-9]{16}\b',data):reason='high-risk credential pattern'
                          else:
                              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob;target.write_bytes(data)
                      if reason:item['excluded_reason']=reason;excludes.append({'branch':branch['name'],'path':path,'reason':reason})
                  save('trees/'+short+'/'+sha+'.json',entries);files+=len(entries)
              collections={}
              for label,tail in [('issues','issues?state=all'),('pulls','pulls?state=all'),('issue-comments','issues/comments'),('review-comments','pulls/comments'),('milestones','milestones?state=all'),('tags','tags')]:collections[label]=store(label,tail)
              for pr in collections['pulls']:
                  for suffix in ('reviews','files','commits'):store('pulls/'+str(pr['number'])+'-'+suffix,'pulls/'+str(pr['number'])+'/'+suffix)
              for sha in sorted({b['commit']['sha'] for b in before}|{p['head']['sha'] for p in collections['pulls'] if p['state']=='open'}):
                  store('heads/'+sha+'-checks','commits/'+sha+'/check-runs','check_runs');store('heads/'+sha+'-statuses','commits/'+sha+'/statuses')
              runs=store('workflow-runs','actions/runs','workflow_runs')
              after=store('branches-end','branches')
              save('metadata/'+short+'/pagination.json',page_log);save('metadata/'+short+'/excluded.json',excludes)
              result={'main_sha':next(b['commit']['sha'] for b in before if b['name']==meta['default_branch']),'branches_stable':[(b['name'],b['commit']['sha']) for b in before]==[(b['name'],b['commit']['sha']) for b in after],'counts':{k:len(v) for k,v in collections.items()},'branch_files':files,'unique_blobs':len(list(blobs.iterdir())),'reachable_commits':int(git('rev-list','--all','--count')),'runs':len(runs),'pages':len(page_log),'errors':errors,'excluded':excludes}
              import shutil;shutil.rmtree(mirror)
              return short,result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:repos=dict(pool.map(collect,('app','infra','gitops','docs')))
          save('snapshot-index.json',{'started_at_utc':start,'finished_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'repositories':repos,'scope':'public source and collaboration snapshot only; runtime and semantic acceptance not performed'})
          print(json.dumps(repos,ensure_ascii=False))
          assert not any(r['errors'] for r in repos.values()),'See collection errors'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: audit-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-resume
          if-no-files-found: error
          retention-days: 14
