name: Docs72 resume verification
on:
  push:
    branches: [docs/b-review-followup-20261007]
    paths: [.github/workflows/b-review72-resume.yml]
permissions:
  contents: write
jobs:
  verify-publish:
    if: ${{ github.actor == 'tjung03' && github.repository == 'seokpan/seokpan-hybrid-docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify unchanged inputs, preserve existing records, publish only six Markdown files
        shell: bash
        run: |
          set -euo pipefail
          BASE=04285b1e19a470f182ccf0902af38da1018910fc
          MAIN=078d9e0007e82aa45d1fe1a81a2e1ca4fbec6a6b
          BRANCH=docs/b-review-followup-20261007
          test "$(git rev-parse HEAD^)" = 4ff345bedd211f547b1290bc6efdd6fd65d9a3df
          test "$(git rev-parse HEAD^^)" = "$BASE"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/docs/b-runtime-input-followup-20261007 | cut -f1)" = d7f0e619bfed462985f931502b00d639ac4d34b4
          REPORT="$RUNNER_TEMP/docs72-resume"
          mkdir "$REPORT"
          python3 .tmp/b-review72-resume.py "$PWD" | tee "$REPORT/verification.log"
          python3 - "$REPORT" <<'PY'
          import hashlib,json,pathlib,sys
          expected={
            'TJUNG03_EXECUTION_BOARD.md':'fd2d163beede5458a4570d448b94e7c6d537def7c7741f7b7a8ac703aa262bbb',
            'TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md':'83ed5583fe9696e7b40a800f8c84793bbbd032e7766bb9441a75d12df3fcddf3',
            'WORK_TRACKER.md':'8908194d9656f8b0b9475ae0c07e84be3469bb16a5626b8677df9914f93877c2',
            '05_IMPLEMENTATION_AND_VALIDATION.md':'af1f8780d9f367085fcb124aa2389e33078a72f2bac12f860995d70e678f8e98',
            'SOURCE_REVIEW_20261007.md':'214afcf3a8ab1e4a96e46936ff144e0990c1cf3616413b8402ca8fb314e29947',
            'REPOSITORY_CONSISTENCY_AUDIT.md':'8c2341d8e54c2676b0294af87c57584c8cb5e3e40756c6922e36dc38def33a70'}
          report=pathlib.Path(sys.argv[1]); actual={}
          for name,digest in expected.items():
              p=pathlib.Path('execution')/name
              data=p.read_bytes(); actual[name]=hashlib.sha256(data).hexdigest()
              assert actual[name]==digest, 'Postimage differs from reviewed local bytes: '+name
              target=report/'files'/p; target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          (report/'output-hashes.json').write_text(json.dumps(actual,indent=2)+'\n')
          PY
          git rm .tmp/b-review72-resume.py .github/workflows/b-review72-resume.yml
          git add execution/TJUNG03_EXECUTION_BOARD.md execution/TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md execution/WORK_TRACKER.md execution/05_IMPLEMENTATION_AND_VALIDATION.md execution/SOURCE_REVIEW_20261007.md execution/REPOSITORY_CONSISTENCY_AUDIT.md
          test "$(git diff --name-only "$BASE" | wc -l)" -eq 6
          test -z "$(git diff --name-only "$BASE" -- .github .tmp design evidence assets)"
          git diff --check --cached
          git -c user.name=tjung03 -c user.email=73955817+tjung03@users.noreply.github.com commit -m 'docs: align review status, staged lab gates, cost inputs and local recovery steps'
          test -z "$(git status --porcelain)"
          git diff "$BASE" HEAD > "$REPORT/changes.patch"
          git rev-parse HEAD > "$REPORT/source-sha.txt"
          git bundle create "$REPORT/source.bundle" HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'Docs72 updated at %s. Six Markdown files; main/Docs69/TH/Q/C records preserved. Runtime NOT RUN; PR merge held.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: docs72-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/docs72-resume/
          retention-days: 30
          if-no-files-found: error
