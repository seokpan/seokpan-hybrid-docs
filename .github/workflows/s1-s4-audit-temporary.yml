name: S1 S2 pinned source audit
on:
  push:
    branches: [audit/b-s1-s4-20261007]
    paths: [.github/workflows/s1-s4-audit-temporary.yml]
permissions:
  contents: read
concurrency:
  group: b-s1-s4-audit-20261007
  cancel-in-progress: false
jobs:
  source-inputs:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve public refs and bounded review metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-inputs"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          out=Path(os.environ['RUNNER_TEMP'])/'review-inputs'
          pins={'app':'bdaa9dfa0a09e5d8efb1714ccf62860315b1346e','infra':'0f47617816b74365f5911ba2e273013ae82d6612','gitops':'12d78ac547729f0e314abfb2ac6238c95b1f3bd7','docs':'fff5ac222243a231e5473f4ab39f87aa6cc10f6f'}
          pagination=[];errors=[]
          def collection(repo,path,key=None):
              result=[];page=1
              while True:
                  url=f'https://api.github.com/repos/seokpan/seokpan-hybrid-{repo}/{path}'+('&' if '?' in path else '?')+f'per_page=100&page={page}'
                  request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'seokpan-source-audit'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      data=json.load(response);link=response.headers.get('Link','')
                  items=data[key] if key else data
                  assert isinstance(items,list),path
                  result.extend(items);more='rel="next"' in link
                  pagination.append({'repo':repo,'path':path,'page':page,'count':len(items),'next':more})
                  if not more:break
                  page+=1
              return result
          report={'started_at':datetime.now(timezone.utc).isoformat(),'pins':pins,'repositories':{}}
          for repo,pin in pins.items():
              directory=out/repo;directory.mkdir();mirror=Path(os.environ['RUNNER_TEMP'])/(repo+'.git')
              subprocess.run(['git','clone','--mirror',f'https://github.com/seokpan/seokpan-hybrid-{repo}.git',str(mirror)],check=True)
              if repo=='gitops':
                  subprocess.run(['git','--git-dir',str(mirror),'fetch','origin','refs/pull/19/head:refs/review/pr19'],check=True)
              subprocess.run(['git','--git-dir',str(mirror),'cat-file','-e',pin+'^{commit}'],check=True)
              subprocess.run(['git','--git-dir',str(mirror),'bundle','create',str(directory/'public-refs.bundle'),'--all'],check=True)
              subprocess.run(['git','--git-dir',str(mirror),'archive','--format=tar',pin,'-o',str(directory/'pinned-source.tar')],check=True)
              (directory/'refs.txt').write_bytes(subprocess.check_output(['git','--git-dir',str(mirror),'show-ref']))
              (directory/'history-index.txt').write_bytes(subprocess.check_output(['git','--git-dir',str(mirror),'log','--all','--format=%H %P %aI %s','--name-status']))
              values={}
              for path,key in [('branches',None),('issues?state=all',None),('issues/comments',None),('pulls?state=all',None),('pulls/comments',None),('milestones?state=all',None),('actions/runs','workflow_runs')]:
                  try:
                      data=collection(repo,path,key);name=path.split('?')[0].replace('/','-')
                      (directory/(name+'.json')).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n');values[name]=len(data)
                  except Exception as exc:errors.append({'repo':repo,'path':path,'error':type(exc).__name__})
              report['repositories'][repo]=values
          report.update(finished_at=datetime.now(timezone.utc).isoformat(),errors=errors,scope='Public source/history collection; not semantic or runtime acceptance')
          (out/'collection.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          (out/'pagination.json').write_text(json.dumps(pagination,indent=2)+'\n')
          hashes={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}
          (out/'SHA256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          if errors:raise SystemExit('Collection has errors; inspect collection.json')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: s1-s4-review-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/review-inputs
          retention-days: 14
          if-no-files-found: error
  app-checks:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: seokpan/seokpan-hybrid-app
          ref: bdaa9dfa0a09e5d8efb1714ccf62860315b1346e
          persist-credentials: false
      - name: Install exactly the Source-declared tool and interpreter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-checks"
          python3 -m venv "$RUNNER_TEMP/uv-tool"
          "$RUNNER_TEMP/uv-tool/bin/pip" install --disable-pip-version-check uv==0.12.5 2>&1 | tee "$RUNNER_TEMP/app-checks/tool-install.log"
          "$RUNNER_TEMP/uv-tool/bin/uv" python install 3.13.15 2>&1 | tee "$RUNNER_TEMP/app-checks/python-install.log"
          echo "$RUNNER_TEMP/uv-tool/bin" >> "$GITHUB_PATH"
      - name: Run existing Backend CI entry point without operational credentials
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          uv run --python 3.13.15 --no-project python scripts/verify_ci.py --run-id "audit-${GITHUB_RUN_ID}" --uv "$(command -v uv)" 2>&1 | tee "$RUNNER_TEMP/app-checks/verify-ci.log"
          git diff --exit-code
      - name: Preserve non-secret test reports and exact source identity
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/app-checks/source-sha.txt"
          if test -d "test-results/audit-${GITHUB_RUN_ID}"; then cp -a "test-results/audit-${GITHUB_RUN_ID}" "$RUNNER_TEMP/app-checks/reports"; fi
          if test -d "backend/test-results/audit-${GITHUB_RUN_ID}"; then cp -a "backend/test-results/audit-${GITHUB_RUN_ID}" "$RUNNER_TEMP/app-checks/backend-reports"; fi
          printf '%s\n' 'Source CI only. Synthetic and loopback tests are not lab/Cloud/T18 acceptance.' > "$RUNNER_TEMP/app-checks/SCOPE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: s1-app-source-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/app-checks
          retention-days: 14
          if-no-files-found: error
