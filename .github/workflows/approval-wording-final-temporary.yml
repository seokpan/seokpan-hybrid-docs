name: Final approval wording and provenance
on:
  push:
    branches: [docs/b-current-guides-audit-20261007]
    paths: [.github/workflows/approval-wording-final-temporary.yml]
permissions:
  contents: write
jobs:
  verify:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Verify and apply three wording corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          python3 -m venv "$RUNNER_TEMP/verify-env"
          "$RUNNER_TEMP/verify-env/bin/pip" install --disable-pip-version-check Pillow==11.3.0 fonttools==4.59.1
          echo "$RUNNER_TEMP/verify-env/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/final-wording"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=Path('design/03_DETAILED_DESIGN.md');before=p.read_text();after=before
          assert hashlib.sha256(before.encode()).hexdigest()=='099281cffca81c82308d15f36a135da6d473d0fc04b357da28ac73c24b253f12'
          changes=[('최신 사용자 지시에 따른 Working Draft 상태 기록','당시 승인에 따른 Working Draft 상태 기록'),('이번 사용자 지시로 사람 계정의 작업 전제를 갱신한다.','2026-10-01 승인으로 사람 계정의 작업 전제를 갱신했다.'),('**근거:** 최신 사용자 지시와 기존 지침 §30~31의','**근거:** 당시 승인 결정과 기존 지침 §30~31의')]
          for old,new in changes:
              assert after.count(old)==1
              after=after.replace(old,new)
          for pat in [r'\[[ xX]\]',r'https?://[^\s)>]+',r'(?<![a-f0-9])[a-f0-9]{40}(?![a-f0-9])']:
              assert re.findall(pat,before)==re.findall(pat,after)
          assert hashlib.sha256(after.encode()).hexdigest()=='b1842d81acde89528698cde55b13f9edb60ebb45c1eafbd5c6d29b1c1349e635'
          p.write_text(after)
          mf=Path('design/source-manifest.json');m=json.loads(mf.read_text())
          for f in m['files']:
              raw=Path(f['path']).read_bytes();f['bytes']=len(raw);f['sha256']=hashlib.sha256(raw).hexdigest()
          mf.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Check output, preserve assets, and publish
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s architecture/tools -p 'test_*.py' > "$RUNNER_TEMP/final-wording/tests.log" 2>&1
          python architecture/tools/verify_diagrams.py --integrity-only > "$RUNNER_TEMP/final-wording/assets.json"
          cp architecture/diagram-manifest.json "$RUNNER_TEMP/manifest-first.json"
          python architecture/tools/verify_diagrams.py --integrity-only
          cmp architecture/diagram-manifest.json "$RUNNER_TEMP/manifest-first.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,shutil
          hashes={'design/03_DETAILED_DESIGN.md':'b1842d81acde89528698cde55b13f9edb60ebb45c1eafbd5c6d29b1c1349e635','design/source-manifest.json':'4a2557408674cf7f476f1927363b40e077d4c66fe12095b22301e9fbc9ac3982','architecture/diagram-manifest.json':'4237ce8263810aef19b86dc9a02b4f746d37806a2e0c2b5043025d48338d4185'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(hashes)
          out=Path(os.environ['RUNNER_TEMP'])/'final-wording'
          for name,sha in hashes.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
              dest=out/'files'/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,dest)
          (out/'hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          (out/'changes.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          subprocess.run(['git','add','--',*hashes],check=True)
          PY
          git -c core.whitespace=-blank-at-eol,blank-at-eof,space-before-tab diff --cached --check
          git rm .github/workflows/approval-wording-final-temporary.yml
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: complete independent approval history and refresh verified identities'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/final-wording/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: final-approval-wording-${{ github.run_id }}
          path: ${{ runner.temp }}/final-wording
          retention-days: 14
