name: Objective source wording verification
on:
  push:
    branches: [docs/b-current-guides-audit-20261007]
    paths: [.github/workflows/neutral-source-temporary.yml]
permissions:
  contents: write
concurrency:
  group: objective-source-wording
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact approved edits and preserve evidence references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          python3 -m venv "$RUNNER_TEMP/verify-env"
          "$RUNNER_TEMP/verify-env/bin/pip" install --disable-pip-version-check Pillow==11.3.0 fonttools==4.59.1
          echo "$RUNNER_TEMP/verify-env/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/objective-source-report"
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          report=Path(os.environ['RUNNER_TEMP'])/'objective-source-report'
          plan=json.loads(Path('.github/maintenance/neutral-source-input.json').read_text())
          allowed={'design/README.md','design/03_DETAILED_DESIGN.md','design/04_IMPLEMENTATION_READINESS.md','architecture/REVIEW_RECORD.md','evidence/README.md','execution/TEAM_EXECUTION_SEQUENCE.md','execution/WORK_TRACKER.md','execution/05_IMPLEMENTATION_AND_VALIDATION.md'}
          assert set(plan)==allowed
          outputs={}; original05=Path('execution/05_IMPLEMENTATION_AND_VALIDATION.md').read_text()
          patterns=[r'\[[ xX]\]',r'https?://[^\s)>]+',r'(?<![a-f0-9])[a-f0-9]{40}(?![a-f0-9])',r'<a\s+[^>]+>']
          for name,edit in plan.items():
              raw=Path(name).read_bytes();before=raw.decode();after=before
              assert hashlib.sha256(raw).hexdigest()==edit['before_sha256'],name
              for old,new in edit['replacements']:
                  assert old in after,(name,old)
                  after=after.replace(old,new)
              assert hashlib.sha256(after.encode()).hexdigest()==edit['after_sha256'],name
              for p in patterns:assert re.findall(p,before)==re.findall(p,after),(name,p)
              assert after.count('```')%2==0 and after.count('<details>')==after.count('</details>'),name
              outputs[name]=after
          def section(t,n):
              x=re.search(r'^### '+re.escape(n)+r'\b.*$',t,re.M);assert x,n
              y=re.search(r'^#{1,3} ',t[x.end():],re.M)
              return t[x.start():x.end()+y.start() if y else len(t)]
          for n in ['8.9','8.10','8.11','8.12','8.13']:
              assert section(original05,n)==section(outputs['execution/05_IMPLEMENTATION_AND_VALIDATION.md'],n),n
          for name,text in outputs.items():Path(name).write_text(text)
          p=Path('design/source-manifest.json');m=json.loads(p.read_text())
          for f in m['files']:
              raw=Path(f['path']).read_bytes();f['bytes']=len(raw);f['sha256']=hashlib.sha256(raw).hexdigest()
          m['consistency_revision']['writing_scope']='Objective approval, supplied evidence and historical execution descriptions; no runtime results or design requirements changed.'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          (report/'preservation.json').write_text(json.dumps({'reviewed_markdown':8,'C_sections_preserved':['8.9','8.10','8.11','8.12','8.13'],'checkbox_states':'UNCHANGED','URLs_and_Source_SHA':'UNCHANGED','runtime':'NOT_PERFORMED'},indent=2)+'\n')
          PY
      - name: Verify provenance, history and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s architecture/tools -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/objective-source-report/provenance-tests.log"
          python -m unittest discover -s tools -p 'test_recovery_metrics.py' -v 2>&1 | tee "$RUNNER_TEMP/objective-source-report/metrics-tests.log"
          python architecture/tools/verify_diagrams.py --integrity-only | tee "$RUNNER_TEMP/objective-source-report/asset-checks.json"
          cp architecture/diagram-manifest.json "$RUNNER_TEMP/manifest-before-repeat.json"
          python architecture/tools/verify_diagrams.py --integrity-only
          cmp architecture/diagram-manifest.json "$RUNNER_TEMP/manifest-before-repeat.json"
          echo '396dc6f5dd2d1376758844626e25b1abc5d3814ce97bde6c8a3ccd8e0003d170  design/source-manifest.json' | sha256sum -c -
          echo 'ab1bdf3e243e49fd04a5ddcce542ba60b618da35f1625a9e550e2ca88f1b4ecc  architecture/diagram-manifest.json' | sha256sum -c -
          git -c core.whitespace=-blank-at-eol,blank-at-eof,space-before-tab diff --check
      - name: Publish bounded changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess,shutil
          from pathlib import Path
          plan=json.loads(Path('.github/maintenance/neutral-source-input.json').read_text())
          allowed=set(plan)|{'design/source-manifest.json','architecture/diagram-manifest.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,sorted(changed^allowed)
          report=Path(os.environ['RUNNER_TEMP'])/'objective-source-report';hashes={}
          for name in sorted(allowed):
              target=report/'files'/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,target)
              hashes[name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          (report/'file-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          (report/'reviewed.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          subprocess.run(['git','add','--',*allowed],check=True)
          PY
          git diff --cached --exit-code HEAD -- architecture/diagrams architecture/exports evidence/runs design/00_PROJECT_STARTING_POINT.md design/01_PROJECT_CHARTER.md
          git rm .github/maintenance/neutral-source-input.json .github/workflows/neutral-source-temporary.yml
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: express design approval and supplied evidence without conversation metadata'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/objective-source-report/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: objective-source-${{ github.run_id }}
          path: ${{ runner.temp }}/objective-source-report
          if-no-files-found: error
          retention-days: 14
