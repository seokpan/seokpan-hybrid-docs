name: Publish bounded S1 S2 source review
on:
  push:
    branches: [audit/b-s1-s4-20261007]
    paths: [.github/workflows/source-review-publish-temporary.yml]
permissions:
  contents: write
concurrency:
  group: b-source-review-publish-20261007
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_BRANCH: audit/b-s1-s4-20261007
      BASE_SHA: fff5ac222243a231e5473f4ab39f87aa6cc10f6f
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the bounded plan and verify all postimages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ce5555159d5741161a986e8fe754ddeaf2e31fce
          mkdir -p "$RUNNER_TEMP/docs-source-review"
          python3 - <<'PY'
          from pathlib import Path
          # Preserve the original checkbox rows. New explanatory paragraphs
          # legitimately repeat TH81; do not require unchanged total occurrences.
          path=Path('.github/maintenance/source-review-followup.py')
          text=path.read_text();lines=text.splitlines(keepends=True)
          rejected=[line for line in lines if line.startswith("    assert re.findall(r'TH-?")]
          assert len(rejected)==1
          path.write_text(''.join(line for line in lines if line not in rejected))
          compile(path.read_text(),str(path),'exec')
          PY
          python3 .github/maintenance/source-review-followup.py | tee "$RUNNER_TEMP/docs-source-review/application.log"
      - name: Verify preservation and publish only reviewed files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,subprocess,shutil
          report=Path(os.environ['RUNNER_TEMP'])/'docs-source-review'
          expected=json.loads((report/'expected-hashes.json').read_text())
          expected['execution/SOURCE_REVIEW_20261007.md']='643cd10c0902275769dd5b397b63fa7f3907e0922bf782eeae3a78bbc2e00028'
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
              target=report/'files'/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,target)
          audit=Path('execution/REPOSITORY_CONSISTENCY_AUDIT.md').read_text()
          old=subprocess.check_output(['git','show',os.environ['BASE_SHA']+':execution/REPOSITORY_CONSISTENCY_AUDIT.md'],text=True)
          assert re.findall(r'^- \[[ x]\] Q\d+.*$',audit,re.M)==re.findall(r'^- \[[ x]\] Q\d+.*$',old,re.M)
          assert 'id="b-source-startup-lua-review-20261007"' in Path('execution/05_IMPLEMENTATION_AND_VALIDATION.md').read_text()
          for name in ['TJUNG03_EXECUTION_BOARD.md','TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md','WORK_TRACKER.md','05_IMPLEMENTATION_AND_VALIDATION.md']:
              text=Path('execution',name).read_text();current=text.split('## 현재 실행 기준',1)[1].split('\n## ',1)[0]
              assert '서버 선언은 아직 main에 없음' not in current
              assert 'de130af839626c9d0a030580693a4060c41c9abd' in current
              assert 'SOURCE_REVIEW_20261007.md' in current
          subprocess.run(['git','add','--',*expected],check=True)
          subprocess.run(['git','rm','.github/maintenance/source-review-followup.py','.github/workflows/s1-s4-audit-temporary.yml','.github/workflows/source-review-publish-temporary.yml'],check=True)
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE_SHA']],text=True).splitlines())
          assert actual==set(expected),actual
          subprocess.run(['git','diff','--cached','--exit-code',os.environ['BASE_SHA'],'--','design','architecture','evidence'],check=True)
          (report/'changes.patch').write_bytes(subprocess.check_output(['git','diff','--cached',os.environ['BASE_SHA']]))
          (report/'all-output-hashes.json').write_text(json.dumps(expected,indent=2)+'\n')
          (report/'scope.json').write_text(json.dumps({'changed_files':6,'postimage_hashes':6,'original_checkboxes_preserved':True,'q_states_preserved':True,'c_section8_preserved':True,'design_architecture_evidence_unchanged':True,'runtime_test':'NOT_PERFORMED','global_q10':'INCOMPLETE'},indent=2)+'\n')
          PY
          git -c core.whitespace=-blank-at-eol,blank-at-eof,space-before-tab diff --cached --check
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: connect tested App corrections and merged lab source to B execution'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/docs-source-review/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: source-review-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-source-review
          if-no-files-found: error
          retention-days: 14
