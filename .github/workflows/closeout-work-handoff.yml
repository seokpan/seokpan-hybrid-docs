name: Review closeout and work handoff verification
on:
  push:
    branches: [docs/b-review-followup-20261007]
    paths: [.github/workflows/closeout-work-handoff.yml]
permissions:
  contents: write
concurrency:
  group: docs72-closeout-20261007
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.actor == 'tjung03' && github.repository == 'seokpan/seokpan-hybrid-docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OLD: 877ce97910795d710dfb011d775a4bddcfb46d78
      MAIN: 7114e8376b41812e86fbec14321d5b5f2224b332
      RETAINED: d7f0e619bfed462985f931502b00d639ac4d34b4
      TARGET: docs/b-review-followup-20261007
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile only the identified main changes without replacing C records
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5ff19c468f537b61be25c66ef383753e7474e61a
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/docs/b-runtime-input-followup-20261007 | cut -f1)" = "$RETAINED"
          mkdir "$RUNNER_TEMP/closeout-report"
          git fetch --quiet origin "$MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          plan=json.loads(Path('.github/maintenance/closeout-summary.json').read_text())
          assert plan['prior_head']==os.environ['OLD'] and plan['incoming_main']==os.environ['MAIN']
          rows=subprocess.check_output(['git','diff','--numstat',plan['old_main'],plan['incoming_main']],text=True).splitlines()
          assert set(rows)=={'1\t1\tdesign/03_DETAILED_DESIGN.md','1\t1\texecution/05_IMPLEMENTATION_AND_VALIDATION.md'},rows
          incoming=subprocess.check_output(['git','show',plan['incoming_main']+':execution/05_IMPLEMENTATION_AND_VALIDATION.md'],text=True)
          assert incoming.count(plan['c05_new'])==1
          result=subprocess.run(['git','merge','--no-ff','--no-commit',plan['incoming_main']],capture_output=True,text=True)
          report=Path(os.environ['RUNNER_TEMP'])/'closeout-report'
          (report/'merge.log').write_text(result.stdout+result.stderr)
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert result.returncode in (0,1),result.stderr
          assert not conflicts or conflicts==['execution/05_IMPLEMENTATION_AND_VALIDATION.md'],conflicts
          assert (result.returncode==0) or bool(conflicts)
          print('Main merge inspected; bounded conflict paths:',conflicts)
          PY
      - name: Verify exact output bytes, prior bodies and new handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/closeout-report/verification.log"
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          plan=json.loads(Path('.github/maintenance/closeout-summary.json').read_text())
          report=Path(os.environ['RUNNER_TEMP'])/'closeout-report'
          originals={}; hashes={}
          for index,row in enumerate(plan['files']):
              path=Path(row['path']);assert path.parent==Path('execution')
              raw=subprocess.check_output(['git','show',plan['prior_head']+':'+str(path)])
              assert hashlib.sha256(raw).hexdigest()==row['before'],str(path)
              old=raw.decode();originals[path.name]=old;text=old
              if index<4:
                  a=text.index('## 현재 실행 기준');b=text.index('\n## ',a+3)
                  oldtail=text[b:]
                  text=text[:a]+plan['current']+text[b:]
              if path.name=='05_IMPLEMENTATION_AND_VALIDATION.md':
                  assert text.count(plan['c05_old'])==1
                  text=text.replace(plan['c05_old'],plan['c05_new'])
                  oldtail=oldtail.replace(plan['c05_old'],plan['c05_new'])
              if path.name=='REPOSITORY_CONSISTENCY_AUDIT.md':
                  a=text.index('> **현재 인계:**');b=text.index('\n',a)
                  text=text[:a]+plan['audit_header']+text[b:]
              text+=plan['appends'].get(str(path),'')
              assert hashlib.sha256(text.encode()).hexdigest()==row['after'],str(path)
              assert re.findall(r'^\s*- \[[ x~]\].*$',old,re.M)==re.findall(r'^\s*- \[[ x~]\].*$',text,re.M),str(path)
              if index<4: assert oldtail in text,str(path)
              path.write_text(text);hashes[str(path)]=row['after']
          path=Path('execution/WORK_HANDOFF_20261007.md');text=path.read_text()
          assert text.count('구분해야 한다。')==1
          text=text.replace('구분해야 한다。','구분해야 한다.')
          assert hashlib.sha256(text.encode()).hexdigest()==plan['handoff_sha256'],'handoff postimage'
          path.write_text(text);hashes[str(path)]=plan['handoff_sha256']
          c=originals['05_IMPLEMENTATION_AND_VALIDATION.md']
          cblock=c[c.index('### 8.9'):c.index('## 9 ',c.index('### 8.9'))]
          assert cblock in Path('execution/05_IMPLEMENTATION_AND_VALIDATION.md').read_text()
          crows=[line for line in originals['WORK_TRACKER.md'].splitlines() if line.startswith('| 김상희 |')]
          assert len(crows)==3
          assert all(line in Path('execution/WORK_TRACKER.md').read_text() for line in crows)
          design=subprocess.check_output(['git','show',plan['incoming_main']+':design/03_DETAILED_DESIGN.md'])
          assert Path('design/03_DETAILED_DESIGN.md').read_bytes()==design
          anchors={'execution/SOURCE_REVIEW_20261007.md':'b-review-closeout-20261007','execution/REPOSITORY_CONSISTENCY_AUDIT.md':'b-review-closeout-audit-20261007','execution/05_IMPLEMENTATION_AND_VALIDATION.md':'b-review-closeout-implementation-20261007'}
          for name,anchor in anchors.items():assert Path(name).read_text().count('id="'+anchor+'"')==1
          guide=Path('execution/TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md').read_text()
          direct=guide[guide.index('<a id="b-direct-actions-20261007">'):]
          blocks=re.findall(r'```bash\n(.*?)\n```',direct,re.S)
          assert len(blocks)==2,len(blocks)
          for code in blocks:subprocess.run(['bash','-n'],input=code,text=True,check=True)
          for name,digest in hashes.items():
              dst=report/'files'/name;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,dst)
          (report/'output-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          (report/'verification.json').write_text(json.dumps({'exact_outputs':7,'current_sections':4,'old_tails_preserved_except_C_main_row':4,'C_8_9_to_8_14_preserved':True,'C_tracker_rows':3,'C_main_design03_exact':True,'old_checkboxes_preserved':True,'bash_syntax_only_blocks':2,'new_anchors':3,'main_and_retained69_not_written':True,'Q10':'INCOMPLETE','personal_or_shared_runtime':'NOT RUN'},indent=2)+'\n')
          print('PASS: seven exact outputs; four current sections; original bodies/checks; C main/sections/rows; two Bash syntax checks; work handoff')
          PY
      - name: Commit and publish only this PR branch after lease checks
        shell: bash
        run: |
          set -euo pipefail
          git add execution/TJUNG03_EXECUTION_BOARD.md execution/TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md execution/WORK_TRACKER.md execution/05_IMPLEMENTATION_AND_VALIDATION.md execution/REPOSITORY_CONSISTENCY_AUDIT.md execution/SOURCE_REVIEW_20261007.md execution/WORK_HANDOFF_20261007.md
          git rm .github/maintenance/closeout-summary.json .github/workflows/closeout-work-handoff.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git diff --cached --name-only "$MAIN" | wc -l)" -eq 7
          git diff --cached --exit-code "$MAIN" -- design architecture evidence .github
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/docs/b-runtime-input-followup-20261007 | cut -f1)" = "$RETAINED"
          git -c user.name=tjung03 -c user.email=73955817+tjung03@users.noreply.github.com commit -m 'docs: preserve C main change and close review batch with verified work handoff'
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > "$RUNNER_TEMP/closeout-report/source-sha.txt"
          git bundle create "$RUNNER_TEMP/closeout-report/source.bundle" HEAD
          git diff "$MAIN" HEAD > "$RUNNER_TEMP/closeout-report/changes.patch"
          printf 'Docs72 only; merged main preserved; Docs69 retained; no runtime or main merge.\n' > "$RUNNER_TEMP/closeout-report/SCOPE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: docs72-closeout-${{ github.run_id }}
          path: ${{ runner.temp }}/closeout-report/
          if-no-files-found: error
          retention-days: 30
