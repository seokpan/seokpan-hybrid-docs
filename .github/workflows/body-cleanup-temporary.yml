name: Final B body wording
on:
  push:
    branches: [docs/b-current-guides-audit-20261007]
    paths: [.github/workflows/body-cleanup-temporary.yml]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  correct:
    if: ${{ github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: '${{ github.sha }}'}
      - name: Correct reviewed B body and verify exact readback
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/maintenance
          cat > .github/maintenance/reviewed-input.json <<'JSON'
          {"schema_version":1,"repository":"seokpan/seokpan-hybrid-docs","files":{},"metadata":[{"endpoint":"issues/21","before_sha256":"c8f0527323e04e531d15256d89fec653031e2c6645efcc77855a256e0385eeeb","after_sha256":"e9ecffd19db4c77bba1ae4254c461d86e1bc09784234715a98ab73fabfea32f5","edits":[[278,279,"2차 프로젝트 4개 저장소를 조회했으며 현재 열린 PR은 아래 4개이고 모두 작성자·assignee가 `tjung03`입니다. h-docs/h-app에는 열린 PR이 없습니다. `docs/recovery-design-decision-20261005`의 삭제 후 h-docs에는 main `ab116463fd1f1a75d54e734c3c1c99cd098f639d`만 남은 것을 확인했습니다. 설계 선택 완료는 유지합니다.\n"],[325,326,"- [x] h-docs PR #27의 `docs/gitops-linux-source-validation-20261004` Branch 삭제 후 이번 작업 시작 원격 목록에서 main만 남은 것을 확인.\n"],[375,376,"- [x] h-app `implementation/app-connection-recovery-20261002`, h-infra `feature/25-rosa-input-contract`, h-docs `docs/app-infra-merged-20261004`의 삭제 보고. 2026-10-04 후속 원격 목록에서 세 Branch 부재와 App reference/c837 보존을 확인.\n"],[397,398,"B의 [h-app Issue #1 Source 답변](https://github.com/seokpan/seokpan-hybrid-app/issues/1)과 05 §8.7·§9.14는 서버 KST 보고와 게임 UTC 작성/읽기·실제 과거 행 미확인을 구분합니다. 기존 두 Branch에 이어 [h-docs PR #23](https://github.com/seokpan/seokpan-hybrid-docs/pull/23)의 `docs/recovery-timezone-handoff-20261003`의 삭제 보고도 받았습니다. `2026-10-03T09:13:31.214Z` 원격 재조회에서 Docs에는 main `4cdf75b50bcd4d8c9d6db0f24e29e2ed89ea2284`만 남은 것을 확인했습니다. 실제 Data/HCL·목표/주기/구조·Run/TH 완료는 추가하지 않았습니다.\n"],[412,413,"[h-docs PR #24](https://github.com/seokpan/seokpan-hybrid-docs/pull/24)의 `docs/app-source-published-20261003` Branch의 삭제 보고도 받았으며, 원격 Branch 목록에는 main `47e6b83ca00b16a74d1fa9057f7a9d719b759be8`만 남음을 확인했습니다.\n"],[422,423,"정태훈(tjung03)의 구현 시작부터 ROSA 최종 정리, 발표, 자료 보존과 후속 인계까지 추적하는 상위 Issue다. 기존 개인 실행계획의 TH-01~19를 고정하며, 실제 작업 결과는 해당 저장소의 원래 Issue·PR·Run에 남긴다. 2026-10-02 연결 구조 확정과 후속 준비 범위에 따라 [Docs #21](https://github.com/seokpan/seokpan-hybrid-docs/issues/21)와 App/GitOps/ROSA 실행 Issue 3개를 등록했다. TH 번호는 유지하며 실제 저장소 번호는 아래 연결표를 따른다.\n"]]}]}
          JSON
          curl -fsSL --retry 2 https://raw.githubusercontent.com/seokpan/seokpan-hybrid-docs/a98b14a509078c34581b93dae7d8fb12f02d1684/.github/maintenance/apply-reviewed-resume.py -o "$RUNNER_TEMP/helper.py"
          test "$(git hash-object "$RUNNER_TEMP/helper.py")" = e06ac3181d83131c2cc986c0ad58bb3e8ae39d0d
          python3 "$RUNNER_TEMP/helper.py"
          rm .github/maintenance/reviewed-input.json
          git diff --exit-code
          git rm .github/workflows/body-cleanup-temporary.yml
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: finish objective B body wording and remove temporary workflow'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-resume-report/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: body-wording-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-resume-report
          retention-days: 14
