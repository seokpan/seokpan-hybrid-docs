name: Four repository audit snapshot
on:
  push:
    branches: [docs/b-registry-vault-followup]
    paths: [.github/workflows/repository-audit-snapshot-temporary.yml]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: repository-audit-snapshot
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Collect public source and collaboration records without executing project code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, subprocess, time, urllib.error, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'repository-audit-snapshot'
          root.mkdir()
          (root / 'blobs').mkdir()
          errors, pages, repos, excluded = [], [], {}, []
          start = datetime.datetime.now(datetime.timezone.utc).isoformat()
          def save(path, obj):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(obj, ensure_ascii=False, indent=2))
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/seokpan/' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'seokpan-read-only-source-audit'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.load(r), r.headers
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 502, 503) and attempt < 2:
                          time.sleep(3 * (attempt + 1)); continue
                      raise RuntimeError(str(e.code) + ' ' + path) from None
              raise RuntimeError('Request failed: ' + path)
          def all_pages(repo, tail, key=None):
              collected = []
              page = 1
              while True:
                  path = repo + '/' + tail + ('&' if '?' in tail else '?') + 'per_page=100&page=' + str(page)
                  payload, headers = get(path)
                  items = payload if key is None else payload[key]
                  assert isinstance(items, list)
                  collected.extend(items)
                  more = 'rel="next"' in headers.get('Link', '')
                  pages.append({'path': path, 'count': len(items), 'has_next': more})
                  if not more:
                      break
                  page += 1
                  assert page < 100, 'Pagination safety limit'
              return collected
          def git(mirror, *args, binary=False):
              return subprocess.check_output(['git', '--git-dir', str(mirror), *args], text=not binary)
          sensitive = re.compile(rb'(?:-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|AGE-SECRET-KEY-[A-Z0-9]{40,}|\b(?:AKIA|ASIA)[A-Z0-9]{16}\b)')
          for short in ('app', 'infra', 'gitops', 'docs'):
              repo = 'seokpan-hybrid-' + short
              meta, _ = get(repo)
              assert meta['private'] is False, 'Only public repository sources are collected'
              branches = all_pages(repo, 'branches')
              save('metadata/' + short + '/repository.json', {k: meta.get(k) for k in ('full_name', 'default_branch', 'visibility', 'pushed_at', 'updated_at')})
              save('metadata/' + short + '/branches-start.json', branches)
              mirror = pathlib.Path(os.environ['RUNNER_TEMP']) / (repo + '.git')
              subprocess.run(['git', 'clone', '--quiet', '--mirror', 'https://github.com/seokpan/' + repo + '.git', str(mirror)], check=True, timeout=180)
              history = git(mirror, 'log', '--all', '--date=iso-strict', '--format=COMMIT %H%nPARENTS %P%nDATE %cI%nSUBJECT %s', '--name-status')
              save('metadata/' + short + '/history-index.json', {'scope': 'reachable current branch and tag commits; filenames, not semantic review', 'text': history})
              trees = []
              for branch in branches:
                  sha = branch['commit']['sha']
                  entries = []
                  raw = git(mirror, 'ls-tree', '-rlz', sha, binary=True)
                  for item in raw.split(b'\0'):
                      if not item: continue
                      info, name = item.split(b'\t', 1)
                      mode, kind, blob, size = info.decode().split()
                      name = name.decode('utf-8')
                      entry = {'path': name, 'mode': mode, 'type': kind, 'blob_sha': blob, 'size': None if size == '-' else int(size)}
                      entries.append(entry)
                      if kind != 'blob': continue
                      ext = pathlib.PurePosixPath(name).suffix.lower()
                      reason = None
                      if ext in ('.ttf', '.otf', '.woff', '.woff2', '.eot', '.key', '.p12', '.pfx', '.age') or '.sops.' in name:
                          reason = 'font or protected key/encrypted input bytes excluded'
                      elif int(size) > 20000000:
                          reason = 'large file: retrieve separately if needed'
                      target = root / 'blobs' / blob
                      if reason is None and not target.exists():
                          data = git(mirror, 'cat-file', 'blob', blob, binary=True)
                          if sensitive.search(data):
                              reason = 'private-key/access-key pattern: no bytes copied'
                          else:
                              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == blob
                              target.write_bytes(data)
                      if reason:
                          entry['excluded_reason'] = reason
                          excluded.append({'repository': repo, 'branch': branch['name'], 'path': name, 'reason': reason})
                  save('trees/' + short + '/' + sha + '.json', entries)
                  trees.append({'branch': branch['name'], 'commit_sha': sha, 'file_count': len(entries)})
              record = {'trees': trees, 'main_sha': next(x['commit']['sha'] for x in branches if x['name'] == meta['default_branch']), 'reachable_commits': int(git(mirror, 'rev-list', '--all', '--count').strip()), 'collections': {}}
              collections = {'issues': 'issues?state=all&sort=created&direction=asc', 'pulls': 'pulls?state=all&sort=created&direction=asc', 'issue-comments': 'issues/comments?sort=created&direction=asc', 'review-comments': 'pulls/comments?sort=created&direction=asc', 'milestones': 'milestones?state=all', 'tags': 'tags'}
              pull_rows = []
              for label, tail in collections.items():
                  try:
                      rows = all_pages(repo, tail)
                      save('metadata/' + short + '/' + label + '.json', rows)
                      record['collections'][label] = len(rows)
                      if label == 'pulls': pull_rows = rows
                  except Exception as e:
                      errors.append({'repository': repo, 'collection': label, 'error': str(e)})
              for pr in pull_rows:
                  n = pr['number']
                  for suffix in ('reviews', 'files', 'commits'):
                      try:
                          rows = all_pages(repo, 'pulls/' + str(n) + '/' + suffix)
                          if suffix == 'files':
                              rows = [{k: v for k, v in row.items() if k != 'patch'} for row in rows]
                          save('metadata/' + short + '/pulls/' + str(n) + '-' + suffix + '.json', rows)
                      except Exception as e:
                          errors.append({'repository': repo, 'pull': n, 'collection': suffix, 'error': str(e)})
              head_shas = set(x['commit']['sha'] for x in branches)
              head_shas.update(x['head']['sha'] for x in pull_rows if x['state'] == 'open')
              for sha in sorted(head_shas):
                  for label, tail, key in (('checks', 'commits/' + sha + '/check-runs', 'check_runs'), ('statuses', 'commits/' + sha + '/statuses', None)):
                      try:
                          save('metadata/' + short + '/heads/' + sha + '-' + label + '.json', all_pages(repo, tail, key))
                      except Exception as e:
                          errors.append({'repository': repo, 'sha': sha, 'collection': label, 'error': str(e)})
              try:
                  runs = all_pages(repo, 'actions/runs', 'workflow_runs')
                  save('metadata/' + short + '/workflow-runs.json', runs)
                  record['collections']['workflow-runs'] = len(runs)
              except Exception as e:
                  errors.append({'repository': repo, 'collection': 'workflow-runs', 'error': str(e)})
              finish_branches = all_pages(repo, 'branches')
              save('metadata/' + short + '/branches-end.json', finish_branches)
              record['branches_stable_during_collection'] = [(x['name'], x['commit']['sha']) for x in branches] == [(x['name'], x['commit']['sha']) for x in finish_branches]
              repos[short] = record
              save('snapshot-index.json', {'started_at_utc': start, 'repositories': repos, 'errors': errors, 'scope': 'collection/index only; semantic review and runtime acceptance not performed'})
              print(short, json.dumps(record, ensure_ascii=False))
          save('pagination.json', pages)
          save('excluded-files.json', excluded)
          save('snapshot-index.json', {'started_at_utc': start, 'finished_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'repositories': repos, 'errors': errors, 'excluded_file_count': len(excluded), 'blob_count': len(list((root / 'blobs').iterdir())), 'scope': 'collection/index only; semantic review and runtime acceptance not performed', 'remaining': 'Resolve inline threads for active PRs, inspect referenced run logs/artifacts as needed, classify each finding and review affected files; deleted unreachable history and excluded bytes are not included'})
          print('SNAPSHOT_COMPLETE', json.dumps({'errors': len(errors), 'repositories': len(repos), 'blobs': len(list((root / 'blobs').iterdir()))}))
          PY
      - name: Preserve snapshot and pagination evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-audit-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/repository-audit-snapshot/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false
