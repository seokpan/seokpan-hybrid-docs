name: PR19 exact-head cancellation verification
on:
  push:
    branches: [audit/b-review-followup-20261007]
    paths: [.github/workflows/review19-exact-head.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: seokpan/seokpan-hybrid-app
          ref: 8f68eb187e72dcc5583f22e6ee04a0f8a0692c58
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned tools and original-code regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8f68eb187e72dcc5583f22e6ee04a0f8a0692c58
          test -z "$(git status --porcelain)"
          python3 -m pip install --quiet --target "$RUNNER_TEMP/pinned-uv" uv==0.12.5
          UV="$RUNNER_TEMP/pinned-uv/bin/uv"
          "$UV" python install 3.13.15
          git worktree add --detach "$RUNNER_TEMP/before" 1cc717ba4e6c7bc14d7778a6d2e2b0417d8332fc
          cp backend/tests/unit/test_realtime_subscription_startup.py "$RUNNER_TEMP/before/backend/tests/unit/"
          mkdir -p "$GITHUB_WORKSPACE/test-results/review19-before"
          cd "$RUNNER_TEMP/before/backend"
          "$UV" sync --frozen
          set +e
          "$UV" run --frozen pytest tests/unit/test_realtime_subscription_startup.py -q --junitxml="$GITHUB_WORKSPACE/test-results/review19-before/junit.xml" > "$GITHUB_WORKSPACE/test-results/review19-before/pytest.log" 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          root = ET.parse(pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'test-results/review19-before/junit.xml').getroot()
          cases = list(root.iter('testcase'))
          failures = list(root.iter('failure'))
          assert len(cases) == 8 and len(failures) == 4
          assert not list(root.iter('error')) and not list(root.iter('skipped'))
          assert all('synthetic cleanup failure' in ''.join(f.itertext()) for f in failures)
          print('Original PR19 + new regression: 4 PASS / 4 FAIL at cleanup RedisError')
          PY
      - name: Existing full Backend policy on final clean PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8f68eb187e72dcc5583f22e6ee04a0f8a0692c58
          test -z "$(git status --porcelain)"
          unset SEOKPAN_REDIS_TEST_SERVER
          UV="$RUNNER_TEMP/pinned-uv/bin/uv"
          PYTHON=$("$UV" python find 3.13.15)
          "$PYTHON" backend/scripts/verify_ci.py --run-id "review19-${GITHUB_RUN_ID}" --uv "$UV"
          REPORT="$GITHUB_WORKSPACE/test-results/review19-${GITHUB_RUN_ID}"
          (cd backend && "$UV" run --frozen pytest tests/unit/test_realtime_subscription_startup.py -q --junitxml="$REPORT/cancellation-junit.xml")
          git diff --exit-code
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$REPORT/source-sha.txt"
          git diff 1cc717ba4e6c7bc14d7778a6d2e2b0417d8332fc HEAD > "$REPORT/review-changes.patch"
          git bundle create "$REPORT/reviewed-source.bundle" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr19-exact-head-${{ github.run_id }}
          path: test-results/
          retention-days: 30
          if-no-files-found: error
