name: Review follow-up document validation
on:
  push:
    branches: [docs/b-review-followup-20261007]
    paths: [.github/workflows/review-followup-publication.yml]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.actor == 'tjung03' && github.repository == 'seokpan/seokpan-hybrid-docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE: 078d9e0007e82aa45d1fe1a81a2e1ca4fbec6a6b
      TARGET: docs/b-review-followup-20261007
      RETAINED: d7f0e619bfed462985f931502b00d639ac4d34b4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact six-file postimages and preserve other owners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 822e8c4ad51bea2e88f9e723be2720a23c70ccc3
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/docs/b-runtime-input-followup-20261007 | cut -f1)" = "$RETAINED"
          mkdir "$RUNNER_TEMP/docs-review-followup"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/docs-review-followup/verification.log"
          from pathlib import Path
          import hashlib,json,os,re,shutil,subprocess
          plan=json.loads(Path('.github/maintenance/review-followup.json').read_text())
          assert plan['base']==os.environ['BASE']
          report=Path(os.environ['RUNNER_TEMP'])/'docs-review-followup'
          changes=plan['changes'];assert len(changes)==6
          original={};outputs={};before_current={}
          for row in changes:
              path=Path(row['path']);name=path.name
              assert path.parent==Path('execution')
              raw=subprocess.check_output(['git','show',plan['base']+':'+str(path)])
              assert raw==path.read_bytes() and hashlib.sha256(raw).hexdigest()==row['before_sha256'],str(path)
              old=raw.decode();original[name]=old;text=old
              if name in [Path(x['path']).name for x in changes[:4]]:
                  start=text.index('## 현재 실행 기준');end=text.index('\n## ',start+3)
                  before_current[name]=old[end:]
                  text=text[:start]+plan['current']+text[end:]
                  text+=plan['suffixes'].get(name,'')
              if name=='TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md':text+=plan['guide_append']
              if name=='SOURCE_REVIEW_20261007.md':text+=plan['source_append']
              if name=='REPOSITORY_CONSISTENCY_AUDIT.md':
                  text+=plan['audit_append'];start=text.index('> **현재 인계:**');end=text.index('\n',start)
                  text=text[:start]+plan['audit_current']+text[end:]
              digest=hashlib.sha256(text.encode()).hexdigest()
              assert digest==row['after_sha256'],f'postimage mismatch: {name}: {digest}'
              assert re.findall(r'^\s*- \[[ x~]\].*$',old,re.M)==re.findall(r'^\s*- \[[ x~]\].*$',text,re.M),name
              assert len(re.findall(r'^```',text,re.M))%2==len(re.findall(r'^```',old,re.M))%2,name
              if name in before_current:assert before_current[name] in text,name
              path.write_text(text);outputs[str(path)]=digest
              target=report/'files'/path;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,target)
          c=original['05_IMPLEMENTATION_AND_VALIDATION.md']
          block=c[c.index('### 8.9'):c.index('## 9 ',c.index('### 8.9'))]
          assert block in Path('execution/05_IMPLEMENTATION_AND_VALIDATION.md').read_text()
          crows=[x for x in original['WORK_TRACKER.md'].splitlines() if x.startswith('| 김상희 |')]
          assert len(crows)==3
          assert all(x in Path('execution/WORK_TRACKER.md').read_text() for x in crows)
          for target,anchor in [('SOURCE_REVIEW_20261007.md','b-review-followup-20261007'),('REPOSITORY_CONSISTENCY_AUDIT.md','b-review-followup-audit-20261007'),('TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md','b-direct-actions-20261007')]:
              assert Path('execution',target).read_text().count('id="'+anchor+'"')==1
          shell_blocks=re.findall(r'```bash\n(.*?)\n```',plan['guide_append'],re.S)
          assert len(shell_blocks)==3
          for number,code in enumerate(shell_blocks):
              subprocess.run(['bash','-n'],input=code,text=True,check=True)
          (report/'output-hashes.json').write_text(json.dumps(outputs,indent=2)+'\n')
          (report/'verification.json').write_text(json.dumps({'files':6,'postimages_checked':6,'current_sections':4,'old_tails_preserved':4,'c_section_preserved':True,'c_rows_preserved':3,'checkboxes_preserved':True,'new_anchor_targets':3,'bash_syntax_only':3,'retained_69_branch_unchanged':True,'personal_or_shared_runtime':'NOT RUN','global_Q10':'INCOMPLETE'},indent=2)+'\n')
          print('PASS: 6 exact postimages / 4 current sections and preserved tails / C section and 3 rows / original checks / 3 anchors / 3 Bash syntax blocks')
          PY
      - name: Publish only reviewed Markdown on the new branch
        shell: bash
        run: |
          set -euo pipefail
          git add execution/TJUNG03_EXECUTION_BOARD.md execution/TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md execution/WORK_TRACKER.md execution/05_IMPLEMENTATION_AND_VALIDATION.md execution/REPOSITORY_CONSISTENCY_AUDIT.md execution/SOURCE_REVIEW_20261007.md
          git rm .github/maintenance/review-followup.json .github/workflows/review-followup-publication.yml
          test "$(git diff --cached --name-only "$BASE" | wc -l)" -eq 6
          git diff --cached --exit-code "$BASE" -- .github design architecture evidence
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/docs/b-runtime-input-followup-20261007 | cut -f1)" = "$RETAINED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: connect reviewed source fixes and agreed lab path to exact personal actions'
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          report=Path(os.environ['RUNNER_TEMP'])/'docs-review-followup'
          for name,digest in json.loads((report/'output-hashes.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > "$RUNNER_TEMP/docs-review-followup/source-sha.txt"
          git bundle create "$RUNNER_TEMP/docs-review-followup/source.bundle" HEAD
          git diff "$BASE" HEAD > "$RUNNER_TEMP/docs-review-followup/changes.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: docs-review-followup-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-review-followup/
          if-no-files-found: error
          retention-days: 30
