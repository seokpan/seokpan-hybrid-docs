name: Integrate reviewed Source findings and current handoffs
on:
  push:
    branches: [docs/b-runtime-input-followup-20261007]
    paths: [.github/workflows/source-review-integration-temporary.yml]
permissions:
  contents: write
concurrency:
  group: b-runtime-source-integration-20261007
  cancel-in-progress: false
jobs:
  integrate:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-docs' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_BRANCH: docs/b-runtime-input-followup-20261007
      INPUT_SHA: fe61e5b0a68a38038685d252c12ac853a2d92d44
      MAIN_SHA: 5b8c529e50e480ce1aa6e83a95caee8d9c877908
      AUDIT_SHA: ee0f3158c91af858d39b89a7cd47c2c681ff16aa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact inputs and merge the existing C main change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$INPUT_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/source-integration"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$MAIN_SHA"
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Preserve current input sections and add only the tested source findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/source-integration/verification.log"
          import hashlib,json,os,re,subprocess,shutil
          from pathlib import Path
          def show(ref,path):
              return subprocess.check_output(['git','show',ref+':'+path]).decode('utf-8')
          def sha(text):return hashlib.sha256(text.encode()).hexdigest()
          def checks(text):return re.findall(r'^\s*- \[[ x~]\].*$',text,re.M)
          root=Path.cwd();report=Path(os.environ['RUNNER_TEMP'])/'source-integration'
          input_sha=os.environ['INPUT_SHA'];audit_sha=os.environ['AUDIT_SHA'];main_sha=os.environ['MAIN_SHA']
          input_hashes={
              'TJUNG03_EXECUTION_BOARD.md':'6bd7d2d540e88e955664e0ee3a6e6cf7b6b73ffb41319742e2a490fd6c2f3e4d',
              'TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md':'602933c843b27ae0e1c5f7189573639fac0ef31817d9a6593e393fb691fecd97',
              'WORK_TRACKER.md':'6d7ee4e95eda48e73741ff3a2e6327dd702a31685ec974503f6471bf135f28de',
              '05_IMPLEMENTATION_AND_VALIDATION.md':'f2cf49a9259e9a8db5a01dc857e235b42f8119292c638bb0af9f74431febf3d7',
              'REPOSITORY_CONSISTENCY_AUDIT.md':'f65d7a2717d0b793489cec31af187657388760f6793318303af2d73e5238bf73'}
          audit_hashes={
              'TJUNG03_EXECUTION_BOARD.md':'987ae1e7b924ed1744b0aae5930e4bc8c75d369d1f09952af25246228d025b69',
              'TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md':'1fe42729cd1c62fe55ed062ac7860c754196ae039cc6f400aeef53acbae2d4ba',
              'WORK_TRACKER.md':'5700722938dc550d1c364ed99f4656d8e87ec49a972353ff51afc2594e9afb6c',
              '05_IMPLEMENTATION_AND_VALIDATION.md':'73365d3a506f46baa7d3a13ca1c99a049cb4df9955d566dc8f9cb3e0282cb0f9',
              'REPOSITORY_CONSISTENCY_AUDIT.md':'c8afe1e9b65d5aa56a268094cd5bac6f4fe47defc42f241c40e1f9ad9b1b5451',
              'SOURCE_REVIEW_20261007.md':'643cd10c0902275769dd5b397b63fa7f3907e0922bf782eeae3a78bbc2e00028'}
          for name,digest in input_hashes.items():assert sha(show(input_sha,'execution/'+name))==digest,name
          source={name:show(audit_sha,'execution/'+name) for name in audit_hashes}
          for name,digest in audit_hashes.items():assert sha(source[name])==digest,name
          before={name:Path('execution',name).read_text() for name in input_hashes}
          expected_merge={'execution/05_IMPLEMENTATION_AND_VALIDATION.md','execution/WORK_TRACKER.md'}
          actual_merge=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual_merge==expected_merge,actual_merge
          newrow='| App Source·새 이미지 | main bdaa의 기존1752검사와 [App #17](https://github.com/seokpan/seokpan-hybrid-app/pull/17) startup 취소 수정(수정2Case·기본1754), [App #18](https://github.com/seokpan/seokpan-hybrid-app/pull/18) Lua 거부 시 board 불변 수정(실제 회귀용 Redis5Case·기본1752)의 red/green·CI 확인 | 두 PR의 C/D 리뷰·실제 병합 → 같은 Backend Build/Scan/Digest → App·held Migration 연결. 기존 Image에 수정이 포함됐다고 승계하지 않음. Valkey만의 기동 준비는 독립. [Source 검토](SOURCE_REVIEW_20261007.md) |'
          input_note='\n**Data 인계 최신화:** [Docs #71](https://github.com/seokpan/seokpan-hybrid-docs/pull/71)의 C 기록과 [Infra #39](https://github.com/seokpan/seokpan-hybrid-infra/pull/39) 병합을 확인했다. C의 jth 해독/해시 보고와 B 수신은 완료, 독립 키 사본/복원 확인은 별도다. 10/8 foundation은 Plan만 수행하는 인계이며 Apply는 전체 Plan·리뷰·Cost 이후 날짜 미확정이다. C의 기존 §8.14·Tracker 행은 보존한다.\n'
          suffixes={
              'TJUNG03_WORKFLOW_AND_LEARNING_GUIDE.md':'## 이번 Source 검토에서 확인할 두 경계',
              'WORK_TRACKER.md':'## B Source 검토 인계 — 2026-10-07',
              '05_IMPLEMENTATION_AND_VALIDATION.md':'<a id="b-source-startup-lua-review-20261007"></a>'}
          for name in list(input_hashes)[:4]:
              text=before[name];oldrows=[line for line in text.splitlines() if line.startswith('| App Source·새 이미지 |')]
              assert len(oldrows)==1,name
              text=text.replace(oldrows[0],newrow,1)
              start=text.index('## 현재 실행 기준');end=text.index('\n## ',start+3)
              text=text[:end]+input_note+text[end:]
              if name in suffixes:
                  marker=suffixes[name];assert source[name].count(marker)==1 and marker not in text,name
                  text+='\n\n'+source[name].split(marker,1)[0][-0:] if False else ''
                  text+='\n\n'+marker+source[name].split(marker,1)[1]
              assert checks(text)==checks(before[name]),name
              assert text.count('```')==before[name].count('```'),name
              Path('execution',name).write_text(text)
          name='REPOSITORY_CONSISTENCY_AUDIT.md';text=before[name]
          prefix='> **현재 인계:**';start=text.index(prefix);end=text.index('\n',start)
          text=text[:start]+'> **현재 인계:** 실행 입력은 [§9](#b-runtime-input-followup-20261007), 이번 Source 결함 재현·수정·검증·후속 인계는 [§10](#b-s1-source-findings-20261007)을 따른다. 이전 체크포인트·Q 체크·실제 수행 이력을 보존한다.'+text[end:]
          marker='## 9. S1–S4 검토 및 F11/F12 후속 — 2026-10-07'
          assert source[name].count(marker)==1 and '## 10. S1–S4' not in text
          text+='\n\n<a id="b-s1-source-findings-20261007"></a>\n## 10. S1–S4 검토 및 F11/F12 후속 — 2026-10-07'+source[name].split(marker,1)[1]
          text+='\n최종 인계 대조에서 Docs #71 main `5b8c529e50e480ce1aa6e83a95caee8d9c877908`의 C §8.14·Tracker 변경과 기존 #69의 현재 입력을 결합했다. 금고 해독 보고/B 수신 완료를 다시 미수신으로 되돌리지 않으며, 독립 키 사본은 별도다. 새 문서 PR 대신 #69에 Source 검토를 연결한다. 감사 작업 브랜치의 산출물은 원 Commit/Run으로 보존하며 임의 삭제하지 않는다.\n'
          assert checks(text)==checks(before[name])
          Path('execution',name).write_text(text)
          text=source['SOURCE_REVIEW_20261007.md']
          old='| 실제 입력 대기 | B 금고 본인 확인·독립 사본, C/D Data/Schema/CA/사용창, A 기반 출력/SG·B Caller/Backend·지원/비용 |'
          new='| 실제 입력 대기 | C의 jth 해독/해시 보고·B 수신 완료를 반영하고 독립 키 사본/복원 확인만 별도 유지. C/D Data/Schema/CA/사용창, A 기반 출력/SG·B Caller/Backend·지원/비용은 각 직접 조건 |'
          assert text.count(old)==1;text=text.replace(old,new)
          text+='\n## 7. 종료 전 병행 변경 수신과 문서 통합\n\n[Docs #69](https://github.com/seokpan/seokpan-hybrid-docs/pull/69)의 기존 HEAD `fe61e5b0a68a38038685d252c12ac853a2d92d44`에서 금고 보고/B 수신·Valkey 단독 준비·ROSA/Pool 입력이 이미 정리됐다. 이 내용을 덮어쓰지 않고 본 검토의 두 App 수정과 인계를 같은 PR에 결합했다. C의 [Docs #71](https://github.com/seokpan/seokpan-hybrid-docs/pull/71) main `5b8c529e50e480ce1aa6e83a95caee8d9c877908`의 §8.14와 Tracker 행도 보존했다.\n\n[Infra #39](https://github.com/seokpan/seokpan-hybrid-infra/pull/39)는 `ceb6fad7b8976941ad93b2b67dbecafd1e0c0959`에 병합됐다. C 기록의 A bootstrap Apply/No changes는 해당 실행 보고이며 본 검토의 직접 AWS 실행이 아니다. 10/8 foundation은 Plan만, Apply는 전체 Plan·팀 리뷰·Cost 이후이며 날짜 미확정이다. Cloud 금고 해독 보고·B 수신은 완료됐고 Controller 밖 독립 키 사본/복원 검증은 별도로 남는다. 실제 C 입력을 기존 미수신 문구로 되돌리지 않는다.\n\n첫 문서 게시 Run37560736306은 수정된 임시 스크립트를 제거하는 단계에서 git rm이 거부해 게시 전 중단됐다. 검토한6파일의 내용 검사는 통과했고 제품 코드 실패가 아니다. 임시 스크립트만 원상 복원 후 제거하도록 고쳐 Run37561183514가 성공했으며, 산출물 Commit `ee0f3158c91af858d39b89a7cd47c2c681ff16aa`를 이번 통합의 고정 입력으로 사용했다. 이전 실패와 성공을 합치지 않는다.\n'
          Path('execution/SOURCE_REVIEW_20261007.md').write_text(text)
          c_main=show(main_sha,'execution/05_IMPLEMENTATION_AND_VALIDATION.md')
          c_block=c_main[c_main.index('### 8.9'):c_main.index('## 9 ',c_main.index('### 8.9'))]
          assert c_block in Path('execution/05_IMPLEMENTATION_AND_VALIDATION.md').read_text()
          c_row=[line for line in show(main_sha,'execution/WORK_TRACKER.md').splitlines() if line.startswith('| 김상희 |')]
          assert len(c_row)==1 and c_row[0] in Path('execution/WORK_TRACKER.md').read_text()
          outputs={}
          for name in audit_hashes:
              path=Path('execution',name);raw=path.read_bytes();outputs[str(path)]=hashlib.sha256(raw).hexdigest()
              target=report/'files'/path;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,target)
          for name,text in before.items():
              (report/('pre-integration-'+name)).write_text(text)
          (report/'output-hashes.json').write_text(json.dumps(outputs,indent=2)+'\n')
          (report/'verification.json').write_text(json.dumps({'current_input_preserved':True,'c_section_8_9_to_8_14_preserved':True,'c_tracker_row_preserved':True,'checkboxes_unchanged':True,'source_inputs':{'main':main_sha,'runtime':input_sha,'audit':audit_sha},'global_q10':'INCOMPLETE','runtime_execution':'NOT_PERFORMED'},indent=2)+'\n')
          print('Exact review inputs, C section/row, existing current inputs and checkbox preservation: PASS')
          PY
      - name: Publish the six reviewed Markdown paths on the existing PR only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          report=Path(os.environ['RUNNER_TEMP'])/'source-integration'
          expected=set(json.loads((report/'output-hashes.json').read_text()))
          subprocess.run(['git','add','--',*expected],check=True)
          subprocess.run(['git','rm','.github/workflows/source-review-integration-temporary.yml'],check=True)
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['MAIN_SHA']],text=True).splitlines())
          assert actual==expected,actual
          subprocess.run(['git','diff','--cached','--exit-code',os.environ['MAIN_SHA'],'--','design','architecture','evidence'],check=True)
          (report/'changes.patch').write_bytes(subprocess.check_output(['git','diff','--cached',os.environ['MAIN_SHA']]))
          PY
          git -c core.whitespace=-blank-at-eol,blank-at-eof,space-before-tab diff --cached --check
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: integrate reproduced App defects while preserving current handoff and C records'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/source-integration/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: source-review-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/source-integration
          retention-days: 14
          if-no-files-found: error
