name: Review follow-up source verification
on:
  push:
    branches: [audit/b-review-followup-20261007]
    paths: [.github/workflows/review-followup-audit.yml]
permissions:
  contents: read
concurrency:
  group: b-review-followup-20261007
  cancel-in-progress: false
jobs:
  app17-final-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: seokpan/seokpan-hybrid-app
          ref: 367938f08e735fe123827b3c9362307b5d59408f
          persist-credentials: false
      - name: Run existing complete Backend policy on exact clean PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 367938f08e735fe123827b3c9362307b5d59408f
          test -z "$(git status --porcelain)"
          python3 -m pip install --quiet --target "$RUNNER_TEMP/pinned-uv" uv==0.12.5
          UV="$RUNNER_TEMP/pinned-uv/bin/uv"
          "$UV" python install 3.13.15
          PYTHON=$("$UV" python find 3.13.15)
          "$PYTHON" backend/scripts/verify_ci.py --run-id "review17-${GITHUB_RUN_ID}" --uv "$UV"
          git diff --exit-code
          git rev-parse HEAD > "test-results/review17-${GITHUB_RUN_ID}/source-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: app17-final-source-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30
  review-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Collect public source, paginated discussions and review submissions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir review-inputs
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess,urllib.request
          root=pathlib.Path('review-inputs'); pages=[]; errors=[]
          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  body=json.load(response); link=response.headers.get('Link','')
              pages.append({'url':url,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat()})
              next_url=None
              for part in link.split(','):
                  if 'rel="next"' in part: next_url=part.split('<')[1].split('>')[0]
              return body,next_url
          def all_pages(url,key=None):
              results=[]
              while url:
                  data,url=get(url);results.extend(data[key] if key else data)
              return results
          for short in ('app','gitops','infra','docs'):
              repo='seokpan/seokpan-hybrid-'+short;base='https://api.github.com/repos/'+repo
              out=root/short;out.mkdir();work=pathlib.Path(os.environ['RUNNER_TEMP'])/short
              subprocess.run(['git','clone','--quiet','--mirror','https://github.com/'+repo+'.git',str(work)],check=True)
              subprocess.run(['git','-C',str(work),'fetch','--quiet','origin','+refs/pull/*/head:refs/audit-pr/*'],check=True)
              head=subprocess.check_output(['git','-C',str(work),'rev-parse','refs/heads/main'],text=True).strip()
              (out/'main-sha.txt').write_text(head+'\n')
              subprocess.run(['git','-C',str(work),'bundle','create',str((out/'public-refs.bundle').resolve()),'--all'],check=True)
              endpoints={'branches':'/branches?per_page=100','issues':'/issues?state=all&per_page=100','issue-comments':'/issues/comments?per_page=100','pulls':'/pulls?state=all&per_page=100','inline-comments':'/pulls/comments?per_page=100','runs':'/actions/runs?per_page=100'}
              stored={}
              for label,suffix in endpoints.items():
                  stored[label]=all_pages(base+suffix,'workflow_runs' if label=='runs' else None)
                  (out/(label+'.json')).write_text(json.dumps(stored[label],ensure_ascii=False,indent=2)+'\n')
              reviews={}
              for pr in stored['pulls']:
                  number=str(pr['number'])
                  reviews[number]=all_pages(base+'/pulls/'+number+'/reviews?per_page=100')
              (out/'reviews.json').write_text(json.dumps(reviews,ensure_ascii=False,indent=2)+'\n')
              selected={'app':[1,2,4,17,18],'gitops':[5,6,10,14,15,19],'infra':[19,23,25,38,39],'docs':[21,43,69,71]}[short]
              timeline={}
              for number in selected:
                  try: timeline[str(number)]=all_pages(base+'/issues/'+str(number)+'/timeline?per_page=100')
                  except Exception as error: errors.append({'repository':repo,'timeline':number,'error':type(error).__name__})
              (out/'selected-timelines.json').write_text(json.dumps(timeline,ensure_ascii=False,indent=2)+'\n')
          (root/'pagination.json').write_text(json.dumps(pages,indent=2)+'\n')
          (root/'errors.json').write_text(json.dumps(errors,indent=2)+'\n')
          manifest={str(path.relative_to(root)):hashlib.sha256(path.read_bytes()).hexdigest() for path in root.rglob('*') if path.is_file()}
          (root/'SHA256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('Read-only collection:',len(pages),'pages;',len(errors),'explicitly recorded limitations')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-inputs-${{ github.run_id }}
          path: review-inputs/
          if-no-files-found: error
          retention-days: 30
